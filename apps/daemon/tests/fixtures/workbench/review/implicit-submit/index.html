<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form</title>
<style>body{margin:0;font:16px/1.5 system-ui;color:#1f2937;background:#fff}main{padding:16px}.bar{width:40px;height:40px;background:#1d4ed8;animation:s 2s linear infinite}@keyframes s{to{transform:translateX(200px)}}input,button{min-height:44px}</style></head>
<body><main><h1>Alerts</h1><div class="bar"></div>
<form method="post" action="https://example.com/unsubscribe"><label for="e">Stop emails for address</label> <input id="e" name="e" type="email" value="a@b.co"></form>
<button type="button" onclick="document.querySelector('.bar').style.animation='none'">Pause animation</button></main></body></html>
