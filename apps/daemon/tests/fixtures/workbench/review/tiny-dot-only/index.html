<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rooms</title>
<style>body{margin:0;font:16px/1.5 system-ui;color:#1f2937;background:#fff}main{padding:16px}</style></head>
<body><main><h1>Studio</h1><p>Rooms.</p><canvas id="dot" width="40" height="4" style="display:block;width:40px;height:4px;margin:8px 0" aria-hidden="true"></canvas></main><script>const cx=document.getElementById('dot').getContext('2d');let dx=0;setInterval(()=>{cx.fillStyle='#fff';cx.fillRect(0,0,40,4);cx.fillStyle='#1d4ed8';cx.fillRect(dx,1,2,2);dx=(dx+3)%38},150);</script></body></html>
