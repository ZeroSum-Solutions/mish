<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Slow carousel</title>
<style>body{margin:0;font:16px/1.5 system-ui;color:#1f2937;background:#fff}main{padding:16px}.carousel{overflow:hidden;height:160px}.track{display:flex;width:300%;height:100%;transition:transform 600ms ease-out}.slide{flex:0 0 33.3333%}.a{background:#bfdbfe}.b{background:#fde68a}.c{background:#bbf7d0}button{min-width:44px;min-height:44px}</style></head>
<body><main><h1>Studio</h1><p>Rooms.</p><div class="carousel" role="img" aria-label="Rooms"><div class="track" id="track"><div class="slide a"></div><div class="slide b"></div><div class="slide c"></div></div></div>
<button type="button" id="pause">Pause carousel</button></main>
<script>let i=0;const t=document.getElementById('track');document.getElementById('pause').addEventListener('click',()=>{/* decoy: does nothing */});
setInterval(()=>{i=(i+1)%3;t.style.transform='translateX('+(-i*33.3333)+'%)'},7500);</script></body></html>
