<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T</title><style>body{margin:0;font:16px/1.5 system-ui;color:#1f2937;background:#fff}main{padding:16px}.carousel{overflow:hidden;height:160px}.track{display:flex;width:300%;height:100%;transition:transform 600ms ease-out}.slide{flex:0 0 33.3333%}.a{background:#bfdbfe}.b{background:#fde68a}.c{background:#bbf7d0}.bar{height:4px;background:#1d4ed8;transform-origin:left;animation:p 2s linear infinite}.bar.off{animation:none}@keyframes p{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion: reduce){.live .bar{animation:none}}button{min-width:44px;min-height:44px}</style></head><body><main><h1>Studio</h1><p>Rooms.</p><div class="carousel" role="img" aria-label="Rooms"><div class="track" id="track"><div class="slide a"></div><div class="slide b"></div><div class="slide c"></div></div></div><div class="bar" id="bar"></div><button type="button" id="pause">Pause carousel</button></main><script>let i=0;const t=document.getElementById('track');document.getElementById('pause').addEventListener('click',()=>document.getElementById('bar').classList.add('off'));setInterval(()=>{i=(i+1)%3;t.style.transform='translateX('+(-i*33.3333)+'%)'},7500);</script></body></html>
