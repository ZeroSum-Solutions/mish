<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T</title><style>body{margin:0;font:16px/1.5 system-ui;color:#1f2937;background:#fff}main{padding:16px}.hero{height:160px;background:#bfdbfe}.hero.b{background:#fde68a}.bar{height:4px;background:#1d4ed8;transform-origin:left;animation:p 2s linear infinite}.bar.off{animation:none}@keyframes p{from{transform:scaleX(0)}to{transform:scaleX(1)}}.ghost{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;animation:g 7.5s linear infinite}@keyframes g{from{color:#000}to{color:#fff}}.carousel{overflow:hidden;height:160px}.track{display:flex;width:300%;height:100%;transition:transform 600ms ease-out}.slide{flex:0 0 33.3333%}.a{background:#bfdbfe}.c{background:#bbf7d0}.d{background:#fde68a}@media (prefers-reduced-motion: reduce){.bar{animation:none}}button{min-width:44px;min-height:44px}</style></head><body><main><h1>Studio</h1><p>Rooms.</p><div class="hero" id="hero" role="img" aria-label="Rooms"></div><div class="bar"></div><button type="button" id="pause">Pause slideshow</button></main><div class="ghost" id="ghost"></div><script>document.getElementById('pause').addEventListener('click',()=>document.querySelector('.bar').classList.add('off')); document.getElementById('ghost').addEventListener('animationiteration',()=>document.getElementById('hero').classList.toggle('b'));</script></body></html>
