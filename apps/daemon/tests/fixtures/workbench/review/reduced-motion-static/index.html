<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carousel with a reduced-motion fallback</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2937; background: #ffffff; }
    main { padding: 16px; max-width: 960px; margin: 0 auto; }
    .cta, .pause { display: inline-block; padding: 12px 20px; background: #1d4ed8; color: #ffffff; text-decoration: none; border: 0; border-radius: 6px; font: inherit; }
    .carousel { position: relative; overflow: hidden; height: 160px; border-radius: 8px; margin: 16px 0; }
    .track { display: flex; width: 300%; height: 100%; transition: transform 600ms ease-in-out; }
    .slide { flex: 0 0 33.3333%; height: 100%; }
    .slide.a { background: #bfdbfe; } .slide.b { background: #fde68a; } .slide.c { background: #bbf7d0; }
    .progress { position: absolute; left: 0; bottom: 0; width: 100%; height: 4px; background: #1d4ed8; transform-origin: left center; animation: progress 2s linear infinite; }
    .carousel.paused .progress { animation-play-state: paused; }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* Static fallback: no slide transition and no progress animation. */
    @media (prefers-reduced-motion: reduce) {
      .track { transition: none; }
      .progress { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Our studio</h1>
    <p>Bright rooms, friendly staff and evening appointments.</p>
    <div class="carousel" id="carousel" role="img" aria-label="Photos of the studio rooms">
      <div class="track" id="track"><div class="slide a"></div><div class="slide b"></div><div class="slide c"></div></div>
      <div class="progress"></div>
    </div>
    <p><button class="pause" id="pause" type="button" aria-pressed="false">Pause carousel</button></p>
    <a class="cta" href="book.html">Book now</a>
  </main>
  <script>
    // Moves only while the visitor allows motion and has not paused it; a live switch to reduce stops it.
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('track');
    const pause = document.getElementById('pause');
    let index = 0; let timer = null; let userPaused = false;
    const stop = () => { clearInterval(timer); timer = null; carousel.classList.add('paused'); };
    const start = () => {
      if (timer || userPaused || reduce.matches) return;
      carousel.classList.remove('paused');
      timer = setInterval(() => { index = (index + 1) % 3; track.style.transform = 'translateX(' + (-index * 33.3333) + '%)'; }, 2000);
    };
    pause.addEventListener('click', () => {
      userPaused = !userPaused;
      pause.setAttribute('aria-pressed', String(userPaused));
      pause.textContent = userPaused ? 'Play carousel' : 'Pause carousel';
      if (userPaused) stop(); else start();
    });
    reduce.addEventListener('change', () => { if (reduce.matches) stop(); else start(); });
    start();
  </script>
</body>
</html>
