<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto carousel</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2937; background: #ffffff; }
    main { padding: 16px; max-width: 960px; margin: 0 auto; }
    .cta { display: inline-block; padding: 12px 20px; background: #1d4ed8; color: #ffffff; text-decoration: none; border-radius: 6px; }
    .carousel { position: relative; overflow: hidden; height: 160px; border-radius: 8px; margin: 16px 0; }
    .track { display: flex; width: 300%; height: 100%; transition: transform 600ms ease-in-out; }
    .slide { flex: 0 0 33.3333%; height: 100%; }
    .slide.a { background: #bfdbfe; } .slide.b { background: #fde68a; } .slide.c { background: #bbf7d0; }
    .progress { position: absolute; left: 0; bottom: 0; width: 100%; height: 4px; background: #1d4ed8; transform-origin: left center; animation: progress 2s linear infinite; }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
</head>
<body>
  <main>
    <h1>Our studio</h1>
    <p>Bright rooms, friendly staff and evening appointments.</p>
    <!-- Starts on its own, never stops, has no pause control and ignores prefers-reduced-motion. -->
    <div class="carousel" role="img" aria-label="Photos of the studio rooms">
      <div class="track" id="track"><div class="slide a"></div><div class="slide b"></div><div class="slide c"></div></div>
      <div class="progress"></div>
    </div>
    <a class="cta" href="book.html">Book now</a>
  </main>
  <script>
    let index = 0;
    const track = document.getElementById('track');
    setInterval(() => { index = (index + 1) % 3; track.style.transform = 'translateX(' + (-index * 33.3333) + '%)'; }, 2000);
  </script>
</body>
</html>
