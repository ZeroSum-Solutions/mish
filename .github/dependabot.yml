# Dependabot version updates. Security updates are configured separately by the
# repository's "Dependabot security updates" setting and are not grouped here,
# so a security fix always opens its own PR.
# Open-PR limits stay low because every PR spends CI minutes.
version: 2
updates:
  # One pnpm lockfile at the root covers every workspace package; list each
  # workspace directory so Dependabot sees every package.json manifest.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
      - /tools/*
      - /shells/*
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
