<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">Mishh Mashh</title>
  <desc id="desc">The Mishh Mashh Home composer, redrawn: a chip rail with Prototype selected, and a prompt that reads "A client brief becomes a routed, fact-checked, editable page, built on your own machine." Below it, the build steps brief, route, fill, verify, publish, and a send button.</desc>

  <defs>
    <!-- The app's own background wash (apps/web/src/styles/app-wash.css). -->
    <radialGradient id="wash-blue" cx="0.12" cy="-0.04" r="0.6">
      <stop offset="0" stop-color="#a8c4ec" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#a8c4ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-pink" cx="0.9" cy="0.06" r="0.5">
      <stop offset="0" stop-color="#f0c5d8" stop-opacity="0.5"/>
      <stop offset="0.66" stop-color="#f0c5d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-peach" cx="0.82" cy="0.98" r="0.55">
      <stop offset="0" stop-color="#f7e0c4" stop-opacity="0.6"/>
      <stop offset="0.64" stop-color="#f7e0c4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="460" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#ffffff"/>
    <rect width="1200" height="460" fill="url(#wash-blue)"/>
    <rect width="1200" height="460" fill="url(#wash-pink)"/>
    <rect width="1200" height="460" fill="url(#wash-peach)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="28" fill="none" stroke="#dbdbdb"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="74" font-size="18" font-weight="600" letter-spacing="2.4" fill="#5c5c5c">ZEROSUM SOLUTIONS · LOCAL-FIRST AI DESIGN WORKSPACE</text>
    <text x="60" y="150" font-size="76" font-weight="700" letter-spacing="-2" fill="#202020">Mishh Mashh</text>
  </g>

  <g id="composer" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="188" width="1072" height="236" rx="24" fill="#ffffff" stroke="#dbdbdb"/>

    <!-- Chip rail: the real Home chips, Prototype selected. -->
    <g id="chip-rail" font-size="20" font-weight="500">
      <g transform="translate(92 212)">
        <rect width="156" height="42" rx="21" fill="#ebffde" stroke="#adf788"/>
        <path d="M22 14 v14 M30 14 v14 M17 19 h18 M17 25 h18" stroke="#0d5400" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="46" y="28" fill="#0d5400">Prototype</text>
      </g>
      <g transform="translate(260 212)">
        <rect width="128" height="42" rx="21" fill="#fafafa" stroke="#dbdbdb"/>
        <text x="22" y="28" fill="#494949">Slide deck</text>
      </g>
      <g transform="translate(400 212)">
        <rect width="94" height="42" rx="21" fill="#fafafa" stroke="#dbdbdb"/>
        <text x="22" y="28" fill="#494949">Image</text>
      </g>
      <g transform="translate(506 212)">
        <rect width="134" height="42" rx="21" fill="#fafafa" stroke="#dbdbdb"/>
        <text x="22" y="28" fill="#494949">Document</text>
      </g>
      <g transform="translate(652 212)">
        <rect width="162" height="42" rx="21" fill="#fafafa" stroke="#dbdbdb"/>
        <text x="22" y="28" fill="#494949">Website clone</text>
      </g>
    </g>

    <!-- The prompt is the product's one-sentence value. -->
    <g id="prompt" font-size="32" font-weight="500" fill="#202020">
      <text x="96" y="312">A client brief becomes a routed, fact-checked,</text>
      <text x="96" y="354">editable page, built on your own machine.</text>
      <rect x="684" y="328" width="2.5" height="34" fill="#202020"/>
    </g>

    <!-- Bottom row: the build steps, then the send disc. -->
    <text x="96" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#5c5c5c">brief → route → fill → verify → publish</text>
    <g id="send" transform="translate(1086 386)">
      <circle r="26" fill="#202020"/>
      <path d="M0 11 V-10 M-8 -2 L0 -10 L8 -2" stroke="#87ea5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
