<div style="min-height:280px;display:flex;align-items:center;padding:32px 16px;background:#0b0d12;font-family:system-ui,sans-serif;color:#f5f5f7">
  <form data-genui="ai-chat-input" data-genui-opts='{"suggestions":["Summarise this page","Draft a reply","Find bugs"],"placeholders":["Ask anything…","Paste a link to summarise"]}' style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;width:min(560px,100%);margin:0 auto">
    <label for="genui-demo-ai-chat-input-field" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Message</label>
    <textarea id="genui-demo-ai-chat-input-field" class="genui-ai-chat-input__field" rows="1"></textarea>
    <button type="submit" class="genui-ai-chat-input__send" aria-label="Send">&#8593;</button>
  </form>
</div>
